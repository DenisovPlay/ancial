services:
  zypo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zypo-app
    restart: unless-stopped
    ports:
      # Только localhost: наружу приложение отдаёт Nginx (aapanel) через Rathole-туннель
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
